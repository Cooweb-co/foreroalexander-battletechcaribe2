<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#006c4a">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="/manifest.json">
<title>FinBot — Chat</title>
<style>
  :root {
    --green: #006c4a;
    --green-dark: #00855d;
    --green-soft: #68dba9;
    --bg: #f2f4f6;
    --card: #ffffff;
    --text: #191c1e;
    --muted: #5c647a;
    --line: #e0e3e5;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100dvh;
  }
  aside {
    width: 240px;
    background: #fafbfc;
    border-right: 1px solid var(--line);
    padding: 20px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 6px 10px 22px; }
  .brand .logo {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--green);
    display: grid; place-items: center;
    color: #fff; font-size: 20px;
  }
  .brand b { color: var(--green); font-size: 17px; display: block; }
  .brand small { color: var(--muted); font-size: 11px; }
  aside a {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 14px;
    border-radius: 12px;
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
  }
  aside a.active { background: #dae2fd; }
  aside a:hover:not(.active) { background: #eceef0; }

  main { flex: 1; display: flex; flex-direction: column; max-width: 900px; margin: 0 auto; width: 100%; }
  .chat-head {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 22px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
  }
  .chat-head .avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--green);
    display: grid; place-items: center;
    color: #fff; font-size: 20px;
  }
  .chat-head h1 { font-size: 16px; font-weight: 700; }
  .chat-head .status { font-size: 12px; color: var(--green-dark); font-weight: 500; }
  .chat-head .status::before { content: '● '; }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scroll-behavior: smooth;
  }
  .msg {
    max-width: 78%;
    padding: 11px 15px;
    border-radius: 16px;
    line-height: 1.5;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-break: break-word;
    animation: pop .18s ease-out;
    box-shadow: 0 1px 2px rgba(25,28,30,.05);
  }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } }
  .bot  { background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 6px; align-self: flex-start; }
  .user { background: var(--green); color: #f5fff7; border-bottom-right-radius: 6px; align-self: flex-end; }
  .typing { display: inline-flex; gap: 5px; padding: 15px 16px; }
  .typing i {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted); animation: blink 1.2s infinite;
  }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }

  .chips {
    display: flex;
    gap: 8px;
    padding: 10px 18px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .chips button {
    flex-shrink: 0;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 999px;
    padding: 8px 15px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all .15s;
  }
  .chips button:hover { border-color: var(--green-dark); color: var(--green); background: #f0faf5; }

  form {
    display: flex;
    gap: 10px;
    padding: 12px 18px 18px;
    background: transparent;
  }
  input {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 13px 20px;
    color: var(--text);
    font-size: 15px;
    outline: none;
    box-shadow: 0 1px 2px rgba(25,28,30,.05);
  }
  input:focus { border-color: var(--green-dark); }
  form button {
    width: 48px; height: 48px;
    border: none;
    border-radius: 50%;
    background: var(--green);
    color: #fff;
    font-size: 19px;
    cursor: pointer;
    transition: transform .12s, background .15s;
  }
  form button:hover { background: var(--green-dark); }
  form button:active { transform: scale(.92); }

  @media (max-width: 900px) {
    body { flex-direction: column; }
    aside { width: 100%; flex-direction: row; overflow-x: auto; align-items: center; padding: 10px 14px; }
    .brand { padding-bottom: 6px; }
  }
</style>
</head>
<body>
  <aside>
    <div class="brand">
      <div class="logo">🤖</div>
      <div><b>FinBot</b><small>Asesor financiero IA</small></div>
    </div>
    <a href="/dashboard.html">📊 Resumen</a>
    <a class="active" href="/">💬 Chat</a>
  </aside>

  <main>
    <div class="chat-head">
      <div class="avatar">💰</div>
      <div>
        <h1>FinBot</h1>
        <div class="status">en línea — tu asesor financiero</div>
      </div>
    </div>

    <div id="chat"></div>

    <div class="chips">
      <button data-msg="gasté 15.000 en café">☕ café 15k</button>
      <button data-msg="25k almuerzo">🍽️ almuerzo 25k</button>
      <button data-msg="/resumen">📊 resumen</button>
      <button data-msg="/consejo">💡 consejo</button>
      <button data-msg="/presupuesto 500000">🎯 presupuesto 500k</button>
      <button data-msg="/ayuda">❓ ayuda</button>
    </div>

    <form id="form" autocomplete="off">
      <input id="input" placeholder="Ej: gasté 15.000 en café…" maxlength="500" autofocus>
      <button type="submit" aria-label="Enviar">➤</button>
    </form>
  </main>

<script>
  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');

  const userId = localStorage.getItem('finbot-uid') ??
    (localStorage.setItem('finbot-uid', 'web-' + crypto.randomUUID()), localStorage.getItem('finbot-uid'));

  // Render seguro: texto plano + *negrita* y _cursiva_ de Markdown básico.
  function render(md) {
    const div = document.createElement('div');
    div.textContent = md;
    return div.innerHTML
      .replace(/\*([^*\n]+)\*/g, '<b>$1</b>')
      .replace(/_([^_\n]+)_/g, '<i>$1</i>');
  }

  function addMessage(text, who) {
    const el = document.createElement('div');
    el.className = 'msg ' + who;
    el.innerHTML = render(text);
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
    return el;
  }

  function addTyping() {
    const el = document.createElement('div');
    el.className = 'msg bot typing';
    el.innerHTML = '<i></i><i></i><i></i>';
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
    return el;
  }

  async function send(text) {
    addMessage(text, 'user');
    const typing = addTyping();
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, text }),
      });
      const data = await res.json();
      typing.remove();
      addMessage(data.reply ?? data.error ?? 'Hmm, algo salió mal 😅', 'bot');
    } catch {
      typing.remove();
      addMessage('😓 No pude conectarme al servidor. Inténtalo de nuevo en un momento.', 'bot');
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    send(text);
  });

  document.querySelectorAll('.chips button').forEach((btn) =>
    btn.addEventListener('click', () => send(btn.dataset.msg)),
  );

  send('/ayuda');
</script>
</body>
</html>
