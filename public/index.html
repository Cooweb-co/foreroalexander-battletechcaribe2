<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinBot — Tu Asesor Financiero Personal</title>
<style>
  :root {
    --bg: #0b1120;
    --panel: #111a2e;
    --bubble-bot: #1b2942;
    --bubble-user: #16a34a;
    --text: #e6edf7;
    --muted: #8fa3bf;
    --accent: #22c55e;
    --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: radial-gradient(1200px 600px at 80% -10%, #14304d 0%, var(--bg) 55%);
    color: var(--text);
    height: 100dvh;
    display: flex;
    justify-content: center;
  }
  .app {
    width: min(560px, 100%);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: color-mix(in srgb, var(--panel) 82%, transparent);
    backdrop-filter: blur(6px);
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid #22314f;
  }
  .avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, #22c55e, #0ea5e9);
    display: grid; place-items: center;
    font-size: 22px;
  }
  header h1 { font-size: 16px; }
  header .status { font-size: 12px; color: var(--accent); }
  header .status::before { content: '●  '; }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scroll-behavior: smooth;
  }
  .msg {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: var(--radius);
    line-height: 1.45;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-break: break-word;
    animation: pop .18s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } }
  .bot  { background: var(--bubble-bot); border-bottom-left-radius: 6px; align-self: flex-start; }
  .user { background: var(--bubble-user); border-bottom-right-radius: 6px; align-self: flex-end; color: #04150a; font-weight: 500; }
  .typing { display: inline-flex; gap: 5px; padding: 14px 16px; }
  .typing i {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted); animation: blink 1.2s infinite;
  }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }

  .chips {
    display: flex;
    gap: 8px;
    padding: 8px 14px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .chips button {
    flex-shrink: 0;
    background: transparent;
    border: 1px solid #2c3d5f;
    color: var(--muted);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: all .15s;
  }
  .chips button:hover { border-color: var(--accent); color: var(--text); }

  form {
    display: flex;
    gap: 10px;
    padding: 12px 14px 16px;
    border-top: 1px solid #22314f;
  }
  input {
    flex: 1;
    background: #0d1526;
    border: 1px solid #2c3d5f;
    border-radius: 999px;
    padding: 12px 18px;
    color: var(--text);
    font-size: 15px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  form button {
    width: 46px; height: 46px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    color: #04150a;
    font-size: 19px;
    cursor: pointer;
    transition: transform .12s;
  }
  form button:active { transform: scale(.92); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">💰</div>
    <div style="flex:1">
      <h1>FinBot</h1>
      <div class="status">en línea — tu asesor financiero</div>
    </div>
    <a href="/dashboard.html" style="color:var(--muted);text-decoration:none;font-size:13px;border:1px solid #2c3d5f;border-radius:999px;padding:7px 14px">📊 Dashboard</a>
  </header>

  <div id="chat"></div>

  <div class="chips">
    <button data-msg="gasté 15.000 en café">☕ café 15k</button>
    <button data-msg="25k almuerzo">🍽️ almuerzo 25k</button>
    <button data-msg="/resumen">📊 resumen</button>
    <button data-msg="/presupuesto 500000">🎯 presupuesto 500k</button>
    <button data-msg="/ayuda">❓ ayuda</button>
  </div>

  <form id="form" autocomplete="off">
    <input id="input" placeholder="Ej: gasté 15.000 en café…" maxlength="500" autofocus>
    <button type="submit" aria-label="Enviar">➤</button>
  </form>
</div>

<script>
  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');

  const userId = localStorage.getItem('finbot-uid') ??
    (localStorage.setItem('finbot-uid', 'web-' + crypto.randomUUID()), localStorage.getItem('finbot-uid'));

  // Render seguro: texto plano + *negrita* y _cursiva_ de Markdown básico.
  function render(md) {
    const div = document.createElement('div');
    div.textContent = md;
    return div.innerHTML
      .replace(/\*([^*\n]+)\*/g, '<b>$1</b>')
      .replace(/_([^_\n]+)_/g, '<i>$1</i>');
  }

  function addMessage(text, who) {
    const el = document.createElement('div');
    el.className = 'msg ' + who;
    el.innerHTML = render(text);
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
    return el;
  }

  function addTyping() {
    const el = document.createElement('div');
    el.className = 'msg bot typing';
    el.innerHTML = '<i></i><i></i><i></i>';
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
    return el;
  }

  async function send(text) {
    addMessage(text, 'user');
    const typing = addTyping();
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, text }),
      });
      const data = await res.json();
      typing.remove();
      addMessage(data.reply ?? data.error ?? 'Hmm, algo salió mal 😅', 'bot');
    } catch {
      typing.remove();
      addMessage('😓 No pude conectarme al servidor. ¿Está corriendo `npm run web`?', 'bot');
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    send(text);
  });

  document.querySelectorAll('.chips button').forEach((btn) =>
    btn.addEventListener('click', () => send(btn.dataset.msg)),
  );

  send('/ayuda');
</script>
</body>
</html>
